<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>DR Better - Sign Up</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#061a30;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
}

/* Main Box */
.class-box{
  width:100%;
  max-width:700px;
  min-height:100vh;
  margin:0 auto;
  background:#fff;
  border-radius:0 0 45px 45px;
  padding:55px 30px 35px;
}

/* Heading */
h1{
  margin:0 0 35px;
  color:#6200ee;
  font-size:42px;
  font-weight:900;
}

/* Input Box */
.input-box{
  width:100%;
  height:82px;
  margin-bottom:22px;

  border:1.5px solid #dedede;
  border-radius:45px;

  background:#fff;

  display:flex;
  align-items:center;

  padding:0 25px;
}

/* Input */
.input-box input{
  width:100%;
  height:100%;

  border:none;
  outline:none;

  background:transparent;

  font-size:19px;
  color:#222;
  font-weight:600;
}

/* Text INSIDE box */
.input-box input::placeholder{
  color:#222;
  opacity:1;
  font-weight:700;
}

/* Focus */
.input-box:focus-within{
  border-color:#6200ee;
  box-shadow:0 0 0 2px rgba(98,0,238,.08);
}

/* Sign Up Button */
button{
  width:100%;
  height:82px;

  margin-top:8px;

  border:none;
  border-radius:45px;

  background:#6200ee;
  color:white;

  font-size:23px;
  font-weight:700;

  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

/* Login */
.login-text{
  text-align:center;
  margin-top:25px;

  font-size:19px;
  font-weight:600;

  color:#222;
}

.login-text a{
  color:#6200ee;
  font-weight:700;
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="class-box">

  <h1>Sign Up</h1>

  <form id="registerForm">

    <!-- First Name -->
    <div class="input-box">
      <input
        id="firstName"
        type="text"
        placeholder="First Name"
        required>
    </div>

    <!-- Last Name -->
    <div class="input-box">
      <input
        id="lastName"
        type="text"
        placeholder="Last Name"
        required>
    </div>

    <!-- Username -->
    <div class="input-box">
      <input
        id="username"
        type="text"
        placeholder="Username"
        required>
    </div>

    <!-- Mobile Number -->
    <div class="input-box">
      <input
        id="mobile"
        type="tel"
        placeholder="Mobile Number"
        required>
    </div>

    <!-- Email -->
    <div class="input-box">
      <input
        id="email"
        type="email"
        placeholder="Email"
        required>
    </div>

    <!-- Password -->
    <div class="input-box">
      <input
        id="password"
        type="password"
        placeholder="Password"
        required>
    </div>

    <!-- Referral Code -->
    <div class="input-box">
      <input
        id="referralCode"
        type="text"
        placeholder="Referral Code">
    </div>

    <!-- Game UID -->
    <div class="input-box">
      <input
        id="gameUid"
        type="text"
        placeholder="Game UID">
    </div>

    <!-- Button -->
    <button type="submit">
      Sign Up
    </button>

    <div class="login-text">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </form>

</div>


<script>

document.getElementById("registerForm").onsubmit = async e => {

  e.preventDefault();

  try {

    let r = await fetch("/api/auth/register", {
      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        firstName:document.getElementById("firstName").value,

        lastName:document.getElementById("lastName").value,

        username:document.getElementById("username").value,

        mobile:document.getElementById("mobile").value,

        email:document.getElementById("email").value,

        password:document.getElementById("password").value,

        referralCode:document.getElementById("referralCode").value,

        gameUid:document.getElementById("gameUid").value

      })
    });

    let d = await r.json();

    if(!r.ok){
      throw new Error(d.error || "Signup failed");
    }

    if(d.token){
      localStorage.setItem(
        "DR_BETTER_TOKEN",
        d.token
      );
    }

    location.href = "index.html";

  } catch(e) {

    alert(e.message);

  }

};

</script>

</body>
</html>
