<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>DR Better - Sign Up</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#061a30;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
}

/* MAIN CARD */
.signup-card{
  width:100%;
  max-width:700px;
  min-height:100vh;

  margin:0 auto;

  background:#fff;

  border-radius:0 0 40px 40px;

  padding:30px 30px 25px;
}

/* HEADING */
.signup-card h1{
  margin:0 0 25px;

  color:#6200ee;

  font-size:38px;
  line-height:1.05;

  font-weight:800;
}

/* FORM */
#registerForm{
  width:100%;
}

/* INPUT BOX */
.input-box{
  width:100%;
  height:58px;

  margin-bottom:12px;

  background:#fff;

  border:1.5px solid #e0e0e0;

  border-radius:32px;

  display:flex;
  align-items:center;

  padding:0 22px;

  box-shadow:0 3px 7px rgba(0,0,0,.08);
}

/* INPUT */
.input-box input{
  width:100%;
  height:100%;

  padding:0;

  border:0;
  outline:0;

  background:transparent;

  color:#222;

  font-family:Arial,sans-serif;

  font-size:17px;
  font-weight:500;
}

/* PLACEHOLDER */
.input-box input::placeholder{
  color:#999;
  opacity:1;
}

/* FOCUS */
.input-box:focus-within{
  border-color:#6200ee;
}

/* PASSWORD SHOW */
.password-box{
  position:relative;
}

.password-box input{
  padding-right:55px;
}

.show-btn{
  position:absolute;

  right:20px;
  top:50%;

  transform:translateY(-50%);

  border:0;
  background:transparent;

  color:#222;

  font-size:15px;
  font-weight:700;

  padding:5px;

  cursor:pointer;
}

/* SIGN UP BUTTON */
.signup-btn{
  width:100%;
  height:60px;

  margin-top:7px;

  border:0;
  border-radius:32px;

  background:#6200ee;

  color:#fff;

  font-size:21px;
  font-weight:700;

  cursor:pointer;

  box-shadow:0 4px 10px rgba(98,0,238,.25);
}

.signup-btn:active{
  transform:scale(.98);
}

/* LOGIN */
.login-text{
  text-align:center;

  margin-top:18px;

  color:#222;

  font-size:17px;
  font-weight:500;
}

.login-text a{
  color:#6200ee;

  font-weight:700;

  text-decoration:underline;
}

/* MOBILE */
@media(max-width:480px){

  .signup-card{
    padding:28px 30px 24px;
  }

  .signup-card h1{
    font-size:36px;
    margin-bottom:24px;
  }

  .input-box{
    height:58px;
    margin-bottom:11px;
    padding:0 20px;
  }

  .input-box input{
    font-size:16px;
  }

  .signup-btn{
    height:60px;
    font-size:21px;
  }

  .login-text{
    font-size:16px;
    margin-top:17px;
  }
}

</style>
</head>

<body>

<div class="signup-card">

  <h1>Sign Up</h1>

  <form id="registerForm">

    <!-- FIRST NAME -->
    <div class="input-box">
      <input
        id="firstName"
        type="text"
        placeholder="First Name"
        required>
    </div>

    <!-- LAST NAME -->
    <div class="input-box">
      <input
        id="lastName"
        type="text"
        placeholder="Last Name"
        required>
    </div>

    <!-- USERNAME -->
    <div class="input-box">
      <input
        id="username"
        type="text"
        placeholder="Username"
        required>
    </div>

    <!-- MOBILE -->
    <div class="input-box">
      <input
        id="mobile"
        type="tel"
        placeholder="Mobile Number"
        required>
    </div>

    <!-- EMAIL -->
    <div class="input-box">
      <input
        id="email"
        type="email"
        placeholder="Email"
        required>
    </div>

    <!-- PASSWORD -->
    <div class="input-box password-box">

      <input
        id="password"
        type="password"
        placeholder="Password"
        required>

      <button
        type="button"
        class="show-btn"
        onclick="showPassword()"
        id="showPasswordBtn">
        Show
      </button>

    </div>

    <!-- REFERRAL -->
    <div class="input-box">
      <input
        id="referralCode"
        type="text"
        placeholder="Referral Code">
    </div>

    <!-- GAME UID -->
    <div class="input-box">
      <input
        id="gameUid"
        type="text"
        placeholder="Game UID">
    </div>

    <!-- SIGN UP -->
    <button
      type="submit"
      class="signup-btn">
      Sign Up
    </button>

  </form>

  <!-- LOGIN -->
  <div class="login-text">
    Already have an account?
    <a href="login.html">Login</a>
  </div>

</div>


<script>

/* PASSWORD SHOW / HIDE */

function showPassword(){

  const password =
    document.getElementById("password");

  const btn =
    document.getElementById("showPasswordBtn");

  if(password.type === "password"){

    password.type = "text";

    btn.innerText = "Hide";

  }else{

    password.type = "password";

    btn.innerText = "Show";
  }
}


/* REGISTER */

document
.getElementById("registerForm")
.addEventListener("submit", async function(e){

  e.preventDefault();

  try{

    const r = await fetch(
      "/api/auth/register",
      {
        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          firstName:
          document.getElementById(
            "firstName"
          ).value,

          lastName:
          document.getElementById(
            "lastName"
          ).value,

          username:
          document.getElementById(
            "username"
          ).value,

          mobile:
          document.getElementById(
            "mobile"
          ).value,

          email:
          document.getElementById(
            "email"
          ).value,

          password:
          document.getElementById(
            "password"
          ).value,

          referralCode:
          document.getElementById(
            "referralCode"
          ).value,

          gameUid:
          document.getElementById(
            "gameUid"
          ).value

        })
      }
    );

    const d = await r.json();

    if(!r.ok){

      throw new Error(
        d.error || "Signup failed"
      );

    }

    if(d.token){

      localStorage.setItem(
        "DR_BETTER_TOKEN",
        d.token
      );

    }

    location.href = "index.html";

  }catch(error){

    alert(error.message);

  }

});

</script>

</body>
</html>
