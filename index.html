<script>
let balance=0,selected="";

// Home banner: 4 separate swipeable pages
let bannerIndex=0, bannerTimer=null, bannerStartX=0, bannerDragging=false;
function bannerRender(){
  const track=document.getElementById('bannerTrack'); if(!track)return;
  track.style.transform='translateX(-'+(bannerIndex*100)+'%)';
  document.querySelectorAll('#bannerDots .dot').forEach((d,i)=>d.classList.toggle('active',i===bannerIndex));
}
function bannerGo(i){bannerIndex=(i+4)%4;bannerRender();bannerRestart()}
function bannerMove(dir){bannerGo(bannerIndex+dir)}
function bannerRestart(){clearInterval(bannerTimer);bannerTimer=setInterval(()=>bannerMove(1),5000)}
function bannerTouchStart(e){bannerDragging=true;bannerStartX=e.touches[0].clientX}
function bannerTouchEnd(e){if(!bannerDragging)return;bannerDragging=false;const dx=e.changedTouches[0].clientX-bannerStartX;if(Math.abs(dx)>45)bannerMove(dx<0?1:-1)}
document.addEventListener('DOMContentLoaded',()=>{const c=document.getElementById('homeBannerCarousel');if(c){c.addEventListener('touchstart',bannerTouchStart,{passive:true});c.addEventListener('touchend',bannerTouchEnd,{passive:true});bannerRestart()}});

const API_BASE=(localStorage.getItem('DR_BETTER_API') || (location.protocol==='file:' ? '' : location.origin)).replace(/\/$/,'');
let authToken=localStorage.getItem('DR_BETTER_TOKEN')||'';
let currentUser=null;

function apiHeaders(){
  return {'Content-Type':'application/json',...(authToken?{'Authorization':'Bearer '+authToken}:{})};
}

async function api(path,options={}){
  if(!API_BASE) throw new Error('Backend URL is not configured. Open the app from the deployed backend URL or set DR_BETTER_API.');
  let res;
  try{
    res=await fetch(API_BASE+path,{...options,headers:{...apiHeaders(),...(options.headers||{})}})
  }
  catch(e){
    throw new Error('Backend server is unreachable. Real database mode requires the backend to be running.');
  }
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||'Server request failed');
  return data;
}

function showAuthError(e){show(e?.message||'Server request failed')}

function showAuthMode(mode){
  document.getElementById('loginForm').style.display=mode==='login'?'block':'none';
  document.getElementById('registerForm').style.display=mode==='register'?'block':'none';
  const h=document.getElementById('authHeading');
  if(h) h.innerHTML=mode==='login'?'Welcome to,<br>Login':'Welcome to,<br>Sign Up';
}

function togglePassword(id,btn){
  const input=document.getElementById(id);
  input.type=input.type==='password'?'text':'password';
  btn.innerText=input.type==='password'?'Show':'Hide';
}

async function loginUser(){
  const username=document.getElementById('loginUsername').value.trim(),password=document.getElementById('loginPassword').value;
  if(!username||!password){show('Username and password required');return}
  try{
    const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username,password})});
    authToken=d.token;
    localStorage.setItem('DR_BETTER_TOKEN',authToken);
    currentUser=d.user;
    await afterAuth();
    goHome();
    show('Login successful');
  }catch(e){showAuthError(e)}
}

async function registerUser(){
  const firstName=document.getElementById('regFirstName').value.trim();
  const lastName=document.getElementById('regLastName').value.trim();
  const username=document.getElementById('regUsername').value.trim();
  const mobile=document.getElementById('regMobile').value.trim();
  const email=document.getElementById('regEmail').value.trim();
  const password=document.getElementById('regPassword').value;
  const referralCode=document.getElementById('regReferral').value.trim();
  const gameUid=document.getElementById('regGameUid').value.trim();

  if(!firstName||!lastName||!username||!mobile||!email||!password){
    show('Please fill all required fields');return
  }

  if(password.length<8){
    show('Password must be at least 8 characters');return
  }

  try{
    const d=await api('/api/auth/register',{
      method:'POST',
      body:JSON.stringify({firstName,lastName,username,mobile,email,password,referralCode,gameUid})
    });
    authToken=d.token;
    localStorage.setItem('DR_BETTER_TOKEN',authToken);
    currentUser=d.user;
    await afterAuth();
    goHome();
    show('Account created successfully');
  }catch(e){showAuthError(e)}
}

async function renderContestCards(d){
 const box=document.getElementById("contestCards");
 box.innerHTML='<p class="muted">Loading real contests...</p>';
 try{
  const rows=await api('/api/contests?status=upcoming');
  const filtered=rows.filter(x=>x.game===currentContest);
  if(!filtered.length){
   box.innerHTML='<p class="muted">No upcoming contests available.</p>';
   return;
  }

  box.innerHTML=filtered.map(c=>{
   const left=Math.max(0,c.slots-Number(c.joined_slots||0));
   return `<div class="flowCard">
    <img src="${d.img}">
    <div class="flowPad">
     <div class="flowTitle">${escapeHtml(c.title)}</div>
     <div class="muted">Time : ${new Date(c.starts_at).toLocaleString()}</div>
     <div class="flowGrid">
      <div><small>PRIZE POOL</small><b>🪙 ${c.prize_pool}</b></div>
      <div><small>PER KILL</small><b>🪙 ${d.kill}</b></div>
      <div><small>ENTRY FEE</small><b>🪙 ${c.entry_fee}</b></div>
      <div><small>TYPE</small><b>${d.type}</b></div>
      <div><small>MAP</small><b>${d.map}</b></div>
      <div><small>SLOTS</small><b>${c.slots}</b></div>
     </div>
     <div class="muted">Available: ${left}/${c.slots}</div>
     <button class="flowBtn" onclick="openContestDetails(${c.id})">
      View Contest Details
     </button>
    </div>
   </div>`
  }).join('');
 }catch(e){
  box.innerHTML='<p class="muted">'+escapeHtml(e.message)+'</p>';
 }
}

function escapeHtml(v){
 return String(v).replace(/[&<>'"]/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  "'":'&#39;',
  '"':'&quot;'
 }[c]));
}

function renderPrize(d){
 const ranks=Math.min(9,d.slots);
 const vals=[];
 let remaining=d.prize;

 for(let i=0;i<ranks;i++){
  let val=i==0
   ?Math.round(d.prize*.35)
   :i<3
   ?Math.round(d.prize*.15)
   :Math.max(1,Math.round(d.prize*.07));

  vals.push(val);
  remaining-=val;
 }

 if(remaining>0) vals[0]+=remaining;

 document.getElementById("prizeRows").innerHTML=
  vals.map((v,i)=>`
   <div class="prizeRow">
    <span class="rank">
     ${i+1}${i==0?'st':i==1?'nd':i==2?'rd':'th'} Prize
    </span>
    <b>🪙 ${v}</b>
   </div>
  `).join("");
}
