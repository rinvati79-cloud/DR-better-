<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DR Better</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  padding:0;
  background:#061a30;
  color:#fff;
  font-family:Arial,sans-serif
}
body{padding-bottom:82px}
button,input,textarea{font-family:inherit}
button{border:0;cursor:pointer}

.page{
  display:none;
  min-height:calc(100vh - 82px)
}
.page.active{display:block}

.top{
  height:165px;
  background:#07517f;
  border-radius:0 0 30px 30px;
  padding:28px 14px 14px
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between
}
.profile{
  display:flex;
  align-items:center;
  gap:11px
}
.avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  background:#2196d3;
  border:2px solid #42c9ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:29px
}
.name{
  font-size:27px;
  font-weight:bold
}
.wallet{
  display:flex;
  align-items:center;
  gap:6px
}
.coin{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#f4bd25;
  border:3px solid #ffe47a;
  color:#fff;
  font-size:23px;
  display:flex;
  align-items:center;
  justify-content:center
}
.balance{font-size:18px}
.bell{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#fff;
  color:#18517c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  margin-left:5px
}

.notice{
  height:74px;
  margin:17px 14px 0;
  background:#52677d;
  border-radius:10px;
  display:flex;
  overflow:hidden
}
.noticeIcon{
  width:95px;
  background:#60748b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px
}
.noticeText{
  padding:8px 15px;
  font-size:19px;
  line-height:1.5;
  overflow:hidden
}

.banner{
  height:310px;
  margin:26px 14px 0;
  border:2px solid #19d1d1;
  border-radius:16px;
  overflow:hidden;
  position:relative;
  background:linear-gradient(135deg,#d41414,#ffb000 45%,#237c24)
}
.banner:before{
  content:"WITHDRAWAL";
  position:absolute;
  right:5px;
  top:28px;
  font-size:35px;
  font-weight:900;
  color:#ffe600;
  text-shadow:3px 3px #9b2100
}
.banner:after{
  content:"IN 6 HOURS";
  position:absolute;
  right:18px;
  top:78px;
  font-size:34px;
  font-weight:900;
  color:#fff;
  text-shadow:3px 3px #12831e
}
.money{
  position:absolute;
  left:20px;
  top:75px;
  font-size:70px
}
.clock{
  position:absolute;
  right:65px;
  top:133px;
  width:105px;
  height:105px;
  border-radius:50%;
  background:#eee;
  border:7px solid #ccc;
  color:#222;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px
}
.bannerSmall{
  position:absolute;
  left:20px;
  bottom:57px;
  font-size:20px;
  font-weight:bold
}
.details{
  position:absolute;
  left:23px;
  bottom:12px;
  background:#5628ef;
  color:#fff;
  padding:12px 20px;
  border-radius:25px;
  font-size:17px
}
.bannerImg{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}
.gameImg{
  width:100%;
  height:137px;
  object-fit:cover;
  display:block
}
.game .art{display:none}

/* Four separate swipeable home banner pages */
.bannerCarousel{
  height:310px;
  margin:26px 14px 0;
  border:2px solid #19d1d1;
  border-radius:16px;
  overflow:hidden;
  position:relative;
  background:#111
}
.bannerTrack{
  height:100%;
  display:flex;
  transition:transform .35s ease;
  will-change:transform;
  touch-action:pan-y
}
.bannerSlide{
  min-width:100%;
  height:100%;
  position:relative;
  overflow:hidden
}
.bannerSlide img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}
.bannerSlide .details{z-index:3}
.bannerArrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:38px;
  height:52px;
  border-radius:18px;
  background:#0009;
  color:#fff;
  font-size:42px;
  line-height:42px;
  z-index:4
}
.bannerArrow.left{left:8px}
.bannerArrow.right{right:8px}
.bannerDots{
  position:absolute;
  left:0;
  right:0;
  bottom:10px;
  display:flex;
  justify-content:center;
  gap:7px;
  z-index:5
}
.bannerDots .dot{
  width:9px;
  height:9px;
  padding:0;
  border-radius:50%;
  background:#fff8;
  border:1px solid #fff
}
.bannerDots .dot.active{
  width:24px;
  border-radius:8px;
  background:#fff
}

@media(max-width:420px){
  .bannerCarousel{height:300px}
}

h2{
  text-align:center;
  font-size:28px;
  margin:18px 0 22px
}
.section{padding:0 14px}
.matches{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:11px
}
.match{
  height:132px;
  border-radius:14px;
  background:#fff;
  color:#111;
  font-size:19px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column
}
.matchIcon{
  width:64px;
  height:64px;
  border-radius:14px;
  color:#fff;
  font-size:31px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:7px
}
.green{background:#35c99b}
.cyan{background:#29c7df}
.check{background:#2fbd69}

.title{
  font-size:24px;
  font-weight:bold;
  margin:40px 0 28px
}
.games{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px
}
.game{
  height:178px;
  border:2px solid #1bd1d1;
  border-radius:12px;
  overflow:hidden;
  position:relative;
  color:#fff;
  background:linear-gradient(135deg,#a91616,#e98616)
}
.game:nth-child(2){
  background:linear-gradient(135deg,#202b3d,#e78c1d)
}
.game:nth-child(3){
  background:linear-gradient(135deg,#54210b,#c66b16)
}
.game:nth-child(4){
  background:linear-gradient(135deg,#55200b,#dc851b)
}
.game:nth-child(5){
  background:linear-gradient(135deg,#57178d,#df83dd)
}
.game:nth-child(6){
  background:linear-gradient(135deg,#751d0c,#d87518)
}
.art{
  height:137px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:58px
}
.gameName{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:40px;
  background:#0008;
  padding:10px 6px;
  text-align:left;
  font-size:16px
}
.online{
  position:absolute;
  right:8px;
  bottom:10px
}
.online:before{
  content:"";
  display:inline-block;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#0cc45b;
  margin-right:5px
}

.nav{
  position:fixed;
  z-index:50;
  left:0;
  right:0;
  bottom:0;
  height:82px;
  background:#07517f;
  border-radius:24px 24px 0 0;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  box-shadow:0 -4px 14px #0007
}
.nav button{
  background:transparent;
  color:#fff;
  font-size:16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px
}
.nav button.active{background:#063b64}
.navIcon{
  font-size:30px;
  line-height:30px
}

.header{
  height:76px;
  background:#07517f;
  display:flex;
  align-items:center;
  gap:15px;
  padding:0 15px
}
.header button{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#fff;
  color:#07517f;
  font-size:25px
}
.headerTitle{
  font-size:24px;
  font-weight:bold
}

.card{
  margin:15px;
  background:#fff;
  color:#111;
  border-radius:16px;
  padding:20px;
  box-shadow:0 3px 10px #0004
}
.card h3{
  margin-top:0;
  color:#07517f
}
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 0;
  border-bottom:1px solid #ddd
}
.row:last-child{border:0}

.btn{
  width:100%;
  padding:14px;
  border-radius:10px;
  background:#087bc1;
  color:#fff;
  font-size:17px;
  margin-top:12px
}
.btn.greenBtn{background:#19b96d}

.input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  margin:8px 0;
  font-size:16px
}

.balanceBig{
  text-align:center;
  font-size:42px;
  font-weight:bold;
  color:#087bc1;
  margin:10px
}
.gameList{
  display:grid;
  gap:12px
}
.center{text-align:center}

.avatarBig{
  width:95px;
  height:95px;
  border-radius:50%;
  background:#1689c9;
  border:4px solid #55d2ff;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px
}

.stat{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}
.stat div{
  background:#edf7ff;
  border-radius:10px;
  padding:14px;
  text-align:center;
  color:#07517f
}

.toast{
  position:fixed;
  z-index:100;
  left:15px;
  right:15px;
  bottom:95px;
  background:#111;
  color:#fff;
  padding:14px;
  border-radius:10px;
  text-align:center;
  display:none
}
